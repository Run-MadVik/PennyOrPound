[project]
name='elastic_sync_machine'
version = '1.0.0'
description = 'Penny or Pound: Your go to daily expense tracker'
readme = 'README.md'
authors = [
    { name = 'Vikhyat Gupta', email = 'vkhtgupta@gmail.com' },
]
requires-python = '>=3.11.12'

[tool.black]
target-version = ['py311', 'py312', 'py313']
line-length = 80
skip-string-normalization = false
exclude = '''
(
    tests
)
'''

[tool.isort]
profile = "black"
combine_as_imports = true
combine_star = true
line_length = 80
force_sort_within_sections = true
skip_glob = ["tests/*"]

[tool.pycln]
exclude="apps.py|tests/|__init__.py"
all=true
expand_stars=false

[tool.mypy]
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.utils"
]